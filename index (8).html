<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AH Brant — Frente Livre · Indicadores de Produtividade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --preto:#161311; --preto2:#141110; --fundo:#F1EFED; --papel:#FFFFFF;
    --vinho:#96110D; --vinho-escuro:#6E0C09;
    --verde:#3D8361; --verde-bg:#E4F1E9;
    --vermelho:#D64545; --vermelho-bg:#FBE6E3;
    --amarelo:#C97A1A; --amarelo-bg:#FBEEDD;
    --azul:#3D6A8B; --azul-bg:#E4EDF3;
    --roxo:#6B4C9A; --roxo-bg:#EBE5F3;
    --grafite:#211D1C; --grafite-suave:#655D5A; --linha-grade:#DCD8D5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'IBM Plex Sans', sans-serif; background:var(--fundo); color:var(--grafite);
    background-image: linear-gradient(var(--linha-grade) 1px, transparent 1px), linear-gradient(90deg, var(--linha-grade) 1px, transparent 1px);
    background-size: 28px 28px; }
  h1,h2,h3,h4{ font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.03em; margin:0; color:var(--preto2); }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  #shell{ display:flex; min-height:100vh; }

  #sidebar{ width:230px; flex-shrink:0; background:var(--preto);
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 28px);
    color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  #brand{ padding:20px 20px 16px 20px; border-bottom:1px solid rgba(255,255,255,0.12); }
  #brand img{ width:100%; max-width:196px; display:block; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.35); }
  #brand .mark{ font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; letter-spacing:0.05em; color:#fff; display:flex; align-items:center; gap:7px; margin-top:12px; }
  #brand .sub{ font-size:11px; color:#B9B2AE; margin-top:4px; letter-spacing:0.03em; line-height:1.4; }
  nav{ padding:14px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
  nav button{ all:unset; cursor:pointer; display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:4px;
    font-family:'Oswald', sans-serif; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:#C9C4C1; transition:background .15s, color .15s; }
  nav button svg{ flex-shrink:0; opacity:0.85; }
  nav button:hover{ background:rgba(255,255,255,0.07); color:#fff; }
  nav button.active{ background:var(--vinho); color:#fff; }
  #sidebar-foot{ margin-top:auto; padding:16px 20px; font-size:10.5px; color:#8C8480; border-top:1px solid rgba(255,255,255,0.12); line-height:1.5; }

  #main{ flex:1; min-width:0; padding:32px 40px 60px 40px; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .topbar h2{ font-size:26px; }
  .topbar p.desc{ color:var(--grafite-suave); font-size:13.5px; margin-top:4px; max-width:560px; }

  .card{ background:var(--papel); border:1px solid var(--linha-grade); border-radius:6px; padding:20px 22px; margin-bottom:18px; box-shadow:0 1px 2px rgba(11,30,51,0.04); }
  .card h3{ font-size:16px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .card h3 .tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:11px; color:var(--grafite-suave); font-weight:400; }
  .relatorio-header{ display:flex; align-items:center; gap:14px; }
  .empresa-tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; background:var(--roxo-bg); color:var(--roxo); }
  .estrutura-tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; background:var(--azul-bg); color:var(--azul); }
  .projeto-tag{ font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0; font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; background:var(--amarelo-bg); color:var(--amarelo); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .grid4{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; }
  @media (max-width:900px){ .grid2,.grid3,.grid4{ grid-template-columns:1fr; } }

  label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--grafite-suave); margin-bottom:5px; font-weight:600; }
  input, select, textarea{ width:100%; padding:9px 10px; border:1px solid var(--linha-grade); border-radius:4px; font-size:13.5px;
    font-family:'IBM Plex Sans',sans-serif; background:#fff; color:var(--grafite); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--vinho); outline-offset:1px; border-color:var(--vinho); }
  input:disabled, select:disabled{ background:var(--fundo); color:var(--grafite-suave); }
  .field{ margin-bottom:12px; }
  .btn{ all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px; background:var(--vinho); color:#fff; padding:10px 18px;
    border-radius:4px; font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.05em; text-transform:uppercase; transition:background .15s; }
  .btn:hover{ background:var(--vinho-escuro); }
  .btn:focus-visible{ outline:2px solid var(--preto2); outline-offset:2px; }
  .btn.secondary{ background:var(--preto); }
  .btn.secondary:hover{ background:var(--preto2); }
  .btn.small{ padding:7px 12px; font-size:11.5px; }
  .btn.ghost{ background:transparent; color:var(--grafite-suave); border:1px solid var(--linha-grade); }
  .btn.ghost:hover{ background:var(--fundo); color:var(--grafite); }
  .btn[disabled]{ opacity:.4; cursor:default; pointer-events:none; }
  .icon-btn{ all:unset; cursor:pointer; color:var(--grafite-suave); padding:4px 6px; border-radius:4px; }
  .icon-btn:hover{ background:var(--vermelho-bg); color:var(--vermelho); }
  .icon-btn.up:hover, .icon-btn.down:hover{ background:var(--azul-bg); color:var(--azul); }
  .icon-btn.edit:hover{ background:var(--azul-bg); color:var(--azul); }
  .edit-row-box{ background:var(--azul-bg); border:1px solid var(--azul); border-radius:6px; padding:14px; }
  .inline-edit{ display:inline-flex; align-items:center; gap:6px; }
  .inline-edit input{ padding:4px 8px; font-size:13px; max-width:180px; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-family:'Oswald',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--grafite-suave);
    padding:8px 8px; border-bottom:2px solid var(--linha-grade); }
  td{ padding:9px 8px; border-bottom:1px solid var(--linha-grade); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .num{ font-family:'IBM Plex Mono',monospace; text-align:right; }

  .empty{ text-align:center; padding:44px 20px; color:var(--grafite-suave); }
  .empty .big{ font-family:'Oswald',sans-serif; font-size:16px; color:var(--preto2); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em; }

  .chip{ display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
  .chip.verde{ background:var(--verde-bg); color:var(--verde); }
  .chip.amarelo{ background:var(--amarelo-bg); color:var(--amarelo); }
  .chip.vermelho{ background:var(--vermelho-bg); color:var(--vermelho); }
  .chip.azul{ background:var(--azul-bg); color:var(--azul); }
  .chip.roxo{ background:var(--roxo-bg); color:var(--roxo); }
  .chip.pulse{ position:relative; }
  .chip.pulse::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:6px; animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .kpi-row{ display:flex; gap:22px; margin-bottom:6px; flex-wrap:wrap; }
  .kpi{ min-width:160px; }
  .kpi .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--grafite-suave); margin-bottom:4px; }
  .kpi .value{ font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--preto2); font-weight:600; }

  .idle-row{ margin-bottom:16px; }
  .idle-row .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; gap:10px; flex-wrap:wrap; }
  .idle-row .head .name{ font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.02em; text-transform:uppercase; color:var(--grafite); }
  .idle-row .head .meta{ font-size:11.5px; color:var(--grafite-suave); font-family:'IBM Plex Mono',monospace; }
  .bar-track{ position:relative; height:22px; background:repeating-linear-gradient(90deg, #E3E1DE 0 1px, #F6F5F3 1px 10px, #F6F5F3 10px 50px);
    border:1px solid var(--linha-grade); border-radius:3px; overflow:hidden; }
  .bar-fill{ position:absolute; top:0; left:0; bottom:0; border-radius:2px 0 0 2px; transition:width .3s; min-width:2px; }
  .bar-fill.verde{ background:linear-gradient(180deg, #4C9975, var(--verde)); }
  .bar-fill.amarelo{ background:linear-gradient(180deg, #D98A2C, var(--amarelo)); }
  .bar-fill.vermelho{ background:linear-gradient(180deg, #D14A3B, var(--vermelho)); }
  .bar-fill.azul{ background:linear-gradient(180deg, #5786A6, var(--azul)); }
  .bar-fill.roxo{ background:linear-gradient(180deg, #8367AC, var(--roxo)); }

  .rank-row{ display:grid; grid-template-columns:170px 1fr 230px; align-items:center; gap:10px; margin-bottom:10px; }
  .rank-row .label{ font-size:12.5px; color:var(--grafite); font-family:'Oswald',sans-serif; letter-spacing:0.02em; text-transform:uppercase; }
  .rank-row .val{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:right; color:var(--grafite-suave); }

  .daybars{ display:flex; align-items:flex-end; gap:10px; height:140px; padding:10px 4px 0 4px; overflow-x:auto; }
  .daybar{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:38px; }
  .daybar .col{ width:22px; border-radius:3px 3px 0 0; background:linear-gradient(180deg, #C0433B, var(--vinho)); min-height:3px; }
  .daybar .val{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafite-suave); }
  .daybar .dlabel{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafite-suave); }

  .toast{ position:fixed; bottom:22px; right:22px; background:var(--preto2); color:#fff; padding:12px 18px; border-radius:5px; font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,0.2); opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:none; z-index:999; }
  .toast.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .loading-screen{ display:flex; align-items:center; justify-content:center; height:100vh; width:100%; font-family:'Oswald',sans-serif;
    color:var(--grafite-suave); letter-spacing:0.05em; text-transform:uppercase; font-size:13px; }

  .tap-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .tap-card{ all:unset; cursor:pointer; box-sizing:border-box; display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    gap:3px; min-height:64px; padding:14px 16px; border:1.5px solid var(--linha-grade); border-radius:8px; background:#fff;
    transition:border-color .15s, background .15s, transform .1s; position:relative; }
  .tap-card:active{ transform:scale(0.97); }
  .tap-card:hover{ border-color:var(--vinho); background:#FBF4F3; }
  .tap-card.wait{ border-color:var(--vermelho); background:var(--vermelho-bg); align-items:flex-start; }
  .tap-card.exec{ border-color:var(--roxo); background:var(--roxo-bg); align-items:flex-start; }
  .tap-card.opening{ border-color:var(--azul); background:var(--azul-bg); align-items:flex-start; }
  .tap-card.sugerida{ border-color:var(--verde); }
  .tap-card-num{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--grafite-suave); }
  .tap-card-title{ font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:0.02em; text-transform:uppercase; color:var(--grafite); }
  .tap-card-sub{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--grafite-suave); }
  .menu-card{ position:relative; }
  .menu-card .count{ position:absolute; top:10px; right:10px; background:var(--vinho); color:#fff; font-family:'IBM Plex Mono',monospace;
    font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600; }

  .estaca-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .estaca-chip{ all:unset; cursor:pointer; box-sizing:border-box; min-width:64px; text-align:center; padding:12px 10px;
    border:1.5px solid var(--linha-grade); border-radius:8px; background:#fff; font-family:'IBM Plex Mono',monospace;
    font-size:13px; color:var(--grafite); transition:all .12s; }
  .estaca-chip:active{ transform:scale(0.95); }
  .estaca-chip:hover{ border-color:var(--vinho); }
  .estaca-chip.selected{ background:var(--vermelho-bg); border-color:var(--vinho); color:var(--vinho-escuro); }
  .estaca-chip.edge{ background:var(--vinho); border-color:var(--vinho); color:#fff; font-weight:600; }

  .stepper-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--linha-grade); border-radius:8px; background:#fff; margin-bottom:8px; }
  .stepper-row .nome{ font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.02em; }
  .stepper-controls{ display:flex; align-items:center; gap:10px; }
  .stepper-controls .qtd{ min-width:22px; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; }

  .board{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  @media (max-width:900px){ .board{ grid-template-columns:1fr; } }
  .board-col{ border:1.5px solid var(--linha-grade); border-radius:8px; overflow:hidden; background:#FBFBFA; display:flex; flex-direction:column; }
  .board-col-head{ padding:11px 14px; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.03em; text-transform:uppercase;
    display:flex; justify-content:space-between; align-items:center; color:#fff; }
  .board-col-head .n{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; }
  .board-col.vermelho .board-col-head{ background:var(--vermelho); }
  .board-col.roxo .board-col-head{ background:var(--roxo); }
  .board-col.verde .board-col-head{ background:var(--verde); }
  .board-col-body{ padding:10px; display:flex; flex-direction:column; gap:7px; max-height:340px; overflow-y:auto; }
  .board-item{ background:#fff; border:1px solid var(--linha-grade); border-radius:6px; padding:8px 10px; }
  .board-item .t{ font-family:'Oswald',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:0.02em; color:var(--grafite); }
  .board-item .s{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--grafite-suave); margin-top:2px; }
  .board-empty{ padding:16px 10px; text-align:center; font-size:11.5px; color:var(--grafite-suave); }

  @media print{
    #sidebar, .no-print, .toast{ display:none !important; }
    body{ background:#fff; } #shell{ display:block; } #main{ padding:0; }
    .card{ box-shadow:none; border:1px solid #ccc; break-inside:avoid; }
    .bar-track, .bar-fill, .chip{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  @media (max-width:760px){
    #shell{ flex-direction:column; }
    #sidebar{ width:100%; height:auto; position:sticky; top:0; z-index:50; flex-direction:row; align-items:center; }
    #brand{ display:none; }
    nav{ flex-direction:row; padding:8px 6px; gap:4px; overflow-x:auto; flex:1; }
    nav button{ flex-direction:column; gap:3px; font-size:8.5px; padding:7px 7px; white-space:nowrap; }
    nav button svg{ width:16px; height:16px; }
    #sidebar-foot{ display:none; }
    #main{ padding:16px 14px 40px 14px; }
    .topbar h2{ font-size:21px; }
    .tap-grid{ grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); }
    .kpi-row{ gap:14px; } .kpi{ min-width:44%; }
    .rank-row{ grid-template-columns:1fr; gap:4px; margin-bottom:16px; }
  }
</style>
</head>

async function loadKey(key, fallback){
  if(!db) return fallback;
  try{
    const doc = await db.collection('frente_livre_dados').doc(key).get();
    if(doc.exists && doc.data().value) return JSON.parse(doc.data().value);
    return fallback;
  } catch(e){ return fallback; }
}

function idleHours(reg){
  const start = new Date(reg.liberacao).getTime();
  const end = reg.inicio ? new Date(reg.inicio).getTime() : Date.now();
  if(isNaN(start)) return 0;
  return Math.max(0, (end - start) / 3600000);
}
function execHours(reg){
  if(!reg.inicio) return null;
  const start = new Date(reg.inicio).getTime();
  const end = reg.termino ? new Date(reg.termino).getTime() : Date.now();
  if(isNaN(start)) return null;
  let pausadoMs = (reg.pausas||[]).reduce((s,p)=> s + Math.max(0, new Date(p.fim).getTime() - new Date(p.inicio).getTime()), 0);
  if(reg.pausadoDesde && !reg.termino) pausadoMs += Math.max(0, Date.now() - new Date(reg.pausadoDesde).getTime());
  return Math.max(0, (end - start - pausadoMs) / 3600000);
}
function custoRecursosRegistro(reg){
  // recursos (M.O./equipamento) sempre pertencem à AHBT — o custo conta sempre que houver
  // recurso alocado, independente de qual empresa está executando a etapa.
  const h = execHours(reg);
  if(h===null) return 0;
  return (reg.recursos||[]).reduce((s,a)=>{
    const rec = DB.recursos.find(x=>x.id===a.recursoId);
    if(!rec) return s;
    return s + (rec.custoHora||0) * a.quantidade * h;
  }, 0);
}
function fmtMoeda(v){ return (v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
function fmtHoras(h){
  if(h < 1) return Math.round(h*60) + 'min';
  const inteiro = Math.floor(h);
  const min = Math.round((h-inteiro)*60);
  return min>0 ? `${inteiro}h${min.toString().padStart(2,'0')}` : `${inteiro}h`;
}
function severidade(h){
  if(h <= 1) return 'verde';
  if(h <= 4) return 'amarelo';
  return 'vermelho';
}
function fmtDataHora(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function fmtData(iso){
  if(!iso) return '—';
  const d = new Date(iso+(iso.length<=10?'T12:00:00':''));
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year: iso.length<=10?'2-digit':undefined });
}

function parseEstacaVal(str){
  const parts = String(str).trim().split('+');
  const base = parseInt(parts[0], 10) || 0;
  const plus = parts[1] ? parseInt(parts[1], 10) : 0;
  return base + plus/1000;
}
function formatEstacaVal(val){
  const base = Math.floor(val + 1e-9);
  const rem = Math.round((val-base)*1000);
  return rem>0 ? `${base}+${rem}` : `${base}`;
}
function listaEstacasDoTrecho(f){
  const startVal = parseEstacaVal(f.estacaInicio);
  const endVal = parseEstacaVal(f.estacaTermino);
  const list = [];
  if(Math.abs(startVal - Math.floor(startVal)) > 1e-9) list.push(startVal);
  for(let b = Math.ceil(startVal - 1e-9); b <= Math.floor(endVal + 1e-9); b++) list.push(b);
  if(Math.abs(endVal - Math.floor(endVal)) > 1e-9) list.push(endVal);
  return [...new Set(list)].sort((a,b)=>a-b);
}
const METROS_POR_ESTACA = 20;
function distEstacaMetros(str){
  const parts = String(str).trim().split('+');
  const base = parseInt(parts[0], 10) || 0;
  const plus = parts[1] ? parseInt(parts[1], 10) : 0;
  return base*METROS_POR_ESTACA + plus;
}
function comprimentoFrenteMetros(faixaInicio, faixaFim){
  if(faixaInicio==null || faixaFim==null) return 0;
  return Math.abs(distEstacaMetros(faixaFim) - distEstacaMetros(faixaInicio));
}

        <h3>${esc(tituloPasso)} — qual trecho? ${voltarLink('menu')}</h3>
        ${lista.length ? `<div class="tap-grid">${cards}</div>` : `<div class="empty"><div class="big">Nenhum trecho neste projeto</div><p>Cadastre trechos para "${esc(nomeProjeto(apontar.projetoId))}" na aba Trechos.</p></div>`}
      </div>`;
  }
  const trecho = DB.estacas.find(f=>f.id===apontar.trechoId);
  const estacas = listaEstacasDoTrecho(trecho);
  const min = apontar.faixaInicio===null ? null : Math.min(apontar.faixaInicio, apontar.faixaFim);
  const max = apontar.faixaInicio===null ? null : Math.max(apontar.faixaInicio, apontar.faixaFim);
  const chips = estacas.map(val=>{
    const emFaixa = min!==null && val>=min && val<=max;
    const borda = min!==null && (val===min || val===max);
    return `<button class="estaca-chip ${emFaixa?'selected':''} ${borda?'edge':''}" onclick="tapEstaca(${val})">${formatEstacaVal(val)}</button>`;
  }).join('');
  const resumo = min===null
    ? `Toque na primeira estaca da frente.`
    : (min===max
        ? `Frente selecionada: <strong style="color:var(--grafite)">Estaca ${formatEstacaVal(min)}</strong> — toque em outra pra formar um intervalo, ou confirme só esta.`
        : `Frente selecionada: <strong style="color:var(--grafite)">Estacas ${formatEstacaVal(min)} a ${formatEstacaVal(max)}</strong>`);
  return `
    <div class="card">
      <h3>${esc(tituloPasso)} — qual intervalo? <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="apontar.trechoId=null; apontar.faixaInicio=null; apontar.faixaFim=null; render();">◂ trocar trecho</span></h3>
      <p style="font-size:13px; color:var(--grafite-suave); margin:-6px 0 14px 0">Trecho: <strong style="color:var(--grafite)">${esc(trechoLabel(trecho))}</strong></p>
      <div class="estaca-grid">${chips}</div>
      <p style="font-size:13px; margin:16px 0 0 0">${resumo}</p>
      <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap">
        <button class="btn small ghost" ${min===null?'disabled':''} onclick="ajustarFaixaFim(-10)">− 10m</button>
        <button class="btn small ghost" ${min===null?'disabled':''} onclick="ajustarFaixaFim(10)">+ 10m</button>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap">
        <button class="btn" ${min===null?'disabled':''} onclick="${aoConfirmar}">Confirmar intervalo ▸</button>
        ${min!==null ? `<button class="btn ghost" onclick="limparFaixa()">Limpar seleção</button>` : ''}
      </div>
    </div>`;
}
function tapEstaca(val){
  if(apontar.faixaInicio===null){ apontar.faixaInicio = val; apontar.faixaFim = val; }
  else if(apontar.faixaInicio===apontar.faixaFim && val!==apontar.faixaInicio){
    if(val > apontar.faixaInicio) apontar.faixaFim = val;
    else { apontar.faixaFim = apontar.faixaInicio; apontar.faixaInicio = val; }
  } else { apontar.faixaInicio = val; apontar.faixaFim = val; }
  render();
}
window.tapEstaca = tapEstaca;
function limparFaixa(){ apontar.faixaInicio = null; apontar.faixaFim = null; render(); }
window.limparFaixa = limparFaixa;
function ajustarFaixaFim(deltaMetros){
  if(apontar.faixaInicio===null) return;
  const trecho = DB.estacas.find(f=>f.id===apontar.trechoId);
  const minMetros = Math.min(distEstacaMetros(trecho.estacaInicio), distEstacaMetros(trecho.estacaTermino));
  const maxMetros = Math.max(distEstacaMetros(trecho.estacaInicio), distEstacaMetros(trecho.estacaTermino));
  function deslocar(val){
    const metrosAtual = distEstacaMetros(formatEstacaVal(val));
    let novoMetros = metrosAtual + deltaMetros;
    if(novoMetros > maxMetros) novoMetros = maxMetros;
    if(novoMetros < minMetros) novoMetros = minMetros;
    const novaBase = Math.floor(novoMetros / METROS_POR_ESTACA);
    const novoResto = Math.round(novoMetros - novaBase*METROS_POR_ESTACA);
    return novaBase + novoResto/1000;
  }
  if(apontar.faixaInicio === apontar.faixaFim){
    const novoVal = deslocar(apontar.faixaFim);
    apontar.faixaInicio = novoVal; apontar.faixaFim = novoVal;
  } else {
    apontar.faixaFim = deslocar(apontar.faixaFim);
    if(apontar.faixaFim < apontar.faixaInicio){
      const tmp = apontar.faixaInicio; apontar.faixaInicio = apontar.faixaFim; apontar.faixaFim = tmp;
    }
  }
  render();
}
window.ajustarFaixaFim = ajustarFaixaFim;

/* -- EFETIVO DO DIA (profissionais da empresa executora) — reutilizável -- */
function renderEfetivoStepper(regId, origemAcao){
  const reg = DB.registros.find(r=>r.id===regId);
  if(!reg){ apontar.efetivoRegId=null; return renderApontar(); }
  const empresa = DB.empresas.find(e=>e.id===reg.empresaId);
  const profissionais = (empresa && empresa.profissionais) || [];
  const hoje = hojeStr();
  if(!reg.efetivoDiario) reg.efetivoDiario = [];
  let entrada = reg.efetivoDiario.find(e=>e.data===hoje);
  function qtd(profId){ if(!entrada) return 0; const it = entrada.itens.find(i=>i.profissionalId===profId); return it ? it.quantidade : 0; }
  const cards = profissionais.map(p=>`
    <div class="stepper-row">
      <span class="nome">${esc(p.nome)}</span>
      <div class="stepper-controls">
        <button class="btn small ghost" onclick="alterarQtdProfissional('${regId}','${p.id}','${esc(p.nome)}',-1)">−</button>
        <span class="qtd">${qtd(p.id)}</span>
        <button class="btn small ghost" onclick="alterarQtdProfissional('${regId}','${p.id}','${esc(p.nome)}',1)">+</button>
      </div>
    </div>`).join('');
  return `
    <div class="card">
      <h3>Efetivo de hoje (${fmtData(hoje)}) <span class="tag" style="cursor:pointer; text-decoration:underline" onclick="pularEfetivo('${regId}')">◂ pular / menu</span></h3>
      <p style="font-size:13px; color:var(--grafite-suave); margin-bottom:16px">${esc(regFrenteLabel(reg))} · ${esc(nomeEtapa(reg.etapaId))} · <strong style="color:var(--grafite)">${esc(nomeEmpresa(reg.empresaId))}</strong></p>
      ${profissionais.length ? cards : `<div class="empty"><div class="big">Nenhum profissional cadastrado</div><p>Cadastre os tipos de profissional de "${esc(nomeEmpresa(reg.empresaId))}" na aba Empresas.</p></div>`}
      <button class="btn" style="margin-top:16px" onclick="confirmarEfetivo('${regId}','${origemAcao}')">Confirmar efetivo de hoje ▸</button>
    </div>`;
}
function alterarQtdProfissional(regId, profissionalId, nome, delta){
  const reg = DB.registros.find(r=>r.id===regId);
  const hoje = hojeStr();
  if(!reg.efetivoDiario) reg.efetivoDiario = [];
  let entrada = reg.efetivoDiario.find(e=>e.data===hoje);
  if(!entrada){ entrada = { data: hoje, itens: [] }; reg.efetivoDiario.push(entrada); }
  let item = entrada.itens.find(i=>i.profissionalId===profissionalId);
  if(!item){ item = { profissionalId, nome, quantidade: 0 }; entrada.itens.push(item); }
  item.quantidade = Math.max(0, item.quantidade + delta);
  entrada.itens = entrada.itens.filter(i=>i.quantidade>0);
  persist.registros();
  render();
}
window.alterarQtdProfissional = alterarQtdProfissional;
function confirmarEfetivo(regId, origemAcao){
  apontar.efetivoRegId = null;
  if(origemAcao==='iniciar'){ apontar.alocarRegId = regId; render(); }
  else { showToast('Efetivo de hoje salvo.'); voltarMenu(); }
}
window.confirmarEfetivo = confirmarEfetivo;
function pularEfetivo(regId){

function pausarRegistro(id){
  const r = DB.registros.find(x=>x.id===id);
  if(r.pausadoDesde) return;
  r.pausadoDesde = nowLocalISO();
  persist.registros();
  showToast('Etapa pausada.');
  render();
}
window.pausarRegistro = pausarRegistro;
function retomarRegistro(id){
  const r = DB.registros.find(x=>x.id===id);
  if(!r.pausadoDesde) return;
  if(!r.pausas) r.pausas = [];
  r.pausas.push({ inicio: r.pausadoDesde, fim: nowLocalISO() });
  r.pausadoDesde = null;
  persist.registros();
  showToast('Etapa retomada.');
  render();
}
window.retomarRegistro = retomarRegistro;
function concluirRegistroAgora(id){
  const r = DB.registros.find(x=>x.id===id);
  const prevTermino = r.termino;
  const prevPausadoDesde = r.pausadoDesde;
  const prevPausas = (r.pausas||[]).slice();
  if(r.pausadoDesde){
    r.pausas = [...(r.pausas||[]), { inicio: r.pausadoDesde, fim: nowLocalISO() }];
    r.pausadoDesde = null;
  }
  r.termino = nowLocalISO();
  persist.registros();
  apontar.quantidadeRegId = id;
  render();
  showToast('Etapa concluída.', 'Desfazer', () => {
    r.termino = prevTermino; r.pausadoDesde = prevPausadoDesde; r.pausas = prevPausas;
    apontar.quantidadeRegId = null;
    persist.registros();
    render();
  });
}
window.concluirRegistroAgora = concluirRegistroAgora;

      <p style="font-size:12px; color:var(--grafite-suave); margin-bottom:16px">Use isso quando a AHBT entrar com mão de obra ou equipamento próprio pra ajudar nessa frente — mesmo sendo de outra empresa. Isso conta como H/H e gera custo.</p>

      <button class="btn" style="margin-top:18px" onclick="pularAlocacao()">Concluído ▸</button>
    </div>`;
}
function alterarQtdRecurso(regId, recursoId, delta){
  const reg = DB.registros.find(r=>r.id===regId);
  if(!reg.recursos) reg.recursos = [];
  let item = reg.recursos.find(x=>x.recursoId===recursoId);
  if(!item){ item = { recursoId, quantidade: 0 }; reg.recursos.push(item); }
  item.quantidade = Math.max(0, item.quantidade + delta);
  if(item.quantidade===0) reg.recursos = reg.recursos.filter(x=>x.recursoId!==recursoId);
  persist.registros();
  render();
}

/* ---------------------------------------------------------
   RANKINGS REUTILIZÁVEIS
--------------------------------------------------------- */
function montarRanking(items, calcH){
  const comH = items.map(x => ({ ...x, h: calcH(x), m: comprimentoFrenteMetros(x.faixaInicio, x.faixaFim) }));
  const totalH = comH.reduce((s,x)=>s+x.h, 0);
  const totalM = comH.reduce((s,x)=>s+x.m, 0);
  const media = comH.length ? totalH/comH.length : 0;
  const porEtapa = {};
  comH.forEach(x=>{
    if(!porEtapa[x.etapaId]) porEtapa[x.etapaId] = { soma:0, n:0, metros:0 };
    porEtapa[x.etapaId].soma += x.h; porEtapa[x.etapaId].n += 1; porEtapa[x.etapaId].metros += x.m;
  });
  const ranking = Object.entries(porEtapa).map(([etapaId, v]) => ({
    etapaId, media: v.soma/v.n, n: v.n, metros: v.metros, mPorHora: v.soma>0 ? v.metros/v.soma : null,
  })).sort((a,b)=>b.media-a.media);
  return { comH, mediaGeral: media, ranking, maxMedia: Math.max(...ranking.map(r=>r.media), 1), totalM, totalH, produtividadeGeral: totalH>0 ? totalM/totalH : null };
}
function rankingHtml(ranking, maxMedia, cor){
  return ranking.map(r=>`
    <div class="rank-row">
      <div class="label">${esc(nomeEtapa(r.etapaId))}</div>
      <div class="bar-track"><div class="bar-fill ${cor}" style="width:${Math.max((r.media/maxMedia)*100,2)}%"></div></div>
      <div class="val">${fmtHoras(r.media)} méd. · ${r.n}x${(r.metros>0 && r.mPorHora!==null) ? ` · ${r.metros}m · ${r.mPorHora.toFixed(1)} m/h` : ''}</div>
    </div>`).join('');
}
function montarRankingEmpresa(items, calcH){
  const comH = items.map(x => ({ ...x, h: calcH(x), m: comprimentoFrenteMetros(x.faixaInicio, x.faixaFim) }));
  const porEmpresa = {};
  comH.forEach(x=>{
    if(!porEmpresa[x.empresaId]) porEmpresa[x.empresaId] = { soma:0, n:0, metros:0 };
    porEmpresa[x.empresaId].soma += x.h; porEmpresa[x.empresaId].n += 1; porEmpresa[x.empresaId].metros += x.m;
  });
  const ranking = Object.entries(porEmpresa).map(([empresaId, v]) => ({
    empresaId, media: v.soma/v.n, n: v.n, metros: v.metros, mPorHora: v.soma>0 ? v.metros/v.soma : null,
  })).sort((a,b)=> (b.mPorHora||0) - (a.mPorHora||0));
  return { ranking, maxMPorHora: Math.max(...ranking.map(r=>r.mPorHora||0), 1) };
}
function rankingEmpresaHtml(ranking, maxMPorHora){
  return ranking.map(r=>`
    <div class="rank-row">
      <div class="label">${esc(nomeEmpresa(r.empresaId))}</div>
      <div class="bar-track"><div class="bar-fill verde" style="width:${Math.max(((r.mPorHora||0)/maxMPorHora)*100,2)}%"></div></div>
      <div class="val">${r.mPorHora!==null ? r.mPorHora.toFixed(1)+' m/h' : '—'} · ${fmtHoras(r.media)} méd. · ${r.n}x</div>
    </div>`).join('');
}

        <div class="field"><label>Filtrar por estrutura</label><select onchange="state.filtroEstrutura=this.value; render();"><option value="all">Todas as estruturas</option>${DB.estruturas.map(e=>`<option value="${e.id}" ${state.filtroEstrutura===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></div>
        <div class="field"><label>Filtrar por empresa</label><select onchange="state.filtroEmpresa=this.value; render();"><option value="all">Todas as empresas</option>${DB.empresas.map(e=>`<option value="${e.id}" ${state.filtroEmpresa===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></div>

  if(state.filtroEstrutura!=='all'){ concluidasF = concluidasF.filter(r=>r.estruturaId===state.filtroEstrutura); emExecucaoF = emExecucaoF.filter(r=>r.estruturaId===state.filtroEstrutura); }
  if(state.filtroEmpresa!=='all'){ concluidasF = concluidasF.filter(r=>r.empresaId===state.filtroEmpresa); emExecucaoF = emExecucaoF.filter(r=>r.empresaId===state.filtroEmpresa); }

  const R = montarRanking(concluidasF, execHours);

  const emExecHtml = emExecucaoF.length ? emExecucaoF.map(r=>{
    const h = execHours(r);
    const pausado = !!r.pausadoDesde;

  return `

        <div class="kpi"><div class="label">Metros executados</div><div class="value">${R.totalM}m</div></div>
        <div class="kpi"><div class="label">Produtividade média</div><div class="value">${R.produtividadeGeral!==null ? R.produtividadeGeral.toFixed(1)+' m/h' : '—'}</div></div>
        <div class="kpi"><div class="label">Etapa mais demorada</div><div class="value" style="font-size:14px; font-family:'Oswald',sans-serif; text-transform:uppercase;">${esc(etapaMaisLenta)}</div></div>
        <div class="kpi"><div class="label">Etapa mais rápida</div><div class="value" style="font-size:14px; font-family:'Oswald',sans-serif; text-transform:uppercase;">${esc(etapaMaisRapida)}</div></div>
      </div>

    <div class="card"><h3>Produtividade por empresa <span class="tag">comparativo — mais produtiva primeiro</span></h3>${rankingEmpresaHtml(RE.ranking, RE.maxMPorHora)}</div>

  `;
}

--------------------------------------------------------- */
function listaDiarioLinhas(){
  const linhas = [];
  DB.registros.forEach(r=>{
    (r.efetivoDiario||[]).forEach(entrada=>{
      entrada.itens.forEach(item=>{
        linhas.push({
          data: entrada.data, empresaId: r.empresaId, projetoId: r.projetoId,
          frente: regFrenteLabel(r), etapa: nomeEtapa(r.etapaId), estrutura: nomeEstrutura(r.estruturaId),
          profissional: item.nome, quantidade: item.quantidade, registroId: r.id,
        });
      });
    });
  });
  return linhas.sort((a,b)=> b.data.localeCompare(a.data));
}
function renderDiario(){
  if(DB.empresas.length===0){
    return `<div class="topbar"><div><h2>Diário de Obra</h2></div></div><div class="card"><div class="empty"><div class="big">Cadastre empresas primeiro</div></div></div>`;
  }
  if(!state.diarioEmpresaId) state.diarioEmpresaId = DB.empresas[0].id;
  const empresaOptions = DB.empresas.map(e=>`<option value="${e.id}" ${state.diarioEmpresaId===e.id?'selected':''}>${esc(e.nome)}</option>`).join('');

  let linhas = listaDiarioLinhas().filter(l=>l.empresaId===state.diarioEmpresaId);
  if(state.diarioProjetoId!=='all') linhas = linhas.filter(l=>l.projetoId===state.diarioProjetoId);

  const totalPessoasDia = {};
  linhas.forEach(l=>{ totalPessoasDia[l.data] = (totalPessoasDia[l.data]||0) + l.quantidade; });
  const diasComRegistro = Object.keys(totalPessoasDia).length;

  const rows = linhas.map(l=>`
    <tr>
      <td class="mono">${fmtData(l.data)}</td>

      <td>${esc(l.frente)}</td>
      <td>${esc(l.estrutura)}</td>
      <td>${esc(l.etapa)}</td>
      <td>${esc(l.profissional)}</td>
      <td class="num">${l.quantidade}</td>
    </tr>`).join('');

  return `
    <div class="topbar no-print"><div><h2>Diário de Obra</h2><p class="desc">Efetivo diário lançado por empresa — exporte em PDF ou Excel.</p></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn secondary" onclick="exportarDiarioExcel()">${ICONS.download} Exportar Excel</button>
        <button class="btn" onclick="window.print()">${ICONS.print} Exportar / Imprimir PDF</button>
      </div>
    </div>
    <div class="card no-print">
      <div class="grid2">
        <div class="field"><label>Empresa *</label><select onchange="state.diarioEmpresaId=this.value; render();">${empresaOptions}</select></div>
        <div class="field"><label>Projeto</label><select onchange="state.diarioProjetoId=this.value; render();">${filtroProjetoOptionsHtml(state.diarioProjetoId)}</select></div>
      </div>

        <div>
          <h2 style="font-size:18px; margin-bottom:2px;">Diário de Obra — ${esc(nomeEmpresa(state.diarioEmpresaId))}</h2>
          <p style="font-size:12px; color:var(--grafite-suave); margin:0;">${diasComRegistro} dia(s) com efetivo lançado</p>
        </div>
      </div>
      <div class="card">
        <h3>Lançamentos <span class="tag">${linhas.length} registro(s)</span></h3>
        ${linhas.length ? `<table><thead><tr><th>Data</th><th>Projeto</th><th>Frente</th><th>Estrutura</th><th>Etapa</th><th>Profissional</th><th style="text-align:right">Qtd.</th></tr></thead><tbody>${rows}</tbody></table>`
          : `<div class="empty"><div class="big">Nenhum efetivo lançado ainda</div><p>Use Apontar › Marcar início ou Efetivo do dia.</p></div>`}

function exportarDiarioExcel(){
  const linhas = listaDiarioLinhas().filter(l=>l.empresaId===state.diarioEmpresaId && (state.diarioProjetoId==='all' || l.projetoId===state.diarioProjetoId));
  const dados = linhas.map(l=>({
    Data: fmtData(l.data), Projeto: nomeProjeto(l.projetoId), Frente: l.frente, Estrutura: l.estrutura,
    Etapa: l.etapa, Profissional: l.profissional, Quantidade: l.quantidade,
  }));
  if(!dados.length){ showToast('Nenhum dado pra exportar com esse filtro.'); return; }
  const ws = XLSX.utils.json_to_sheet(dados);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Diário de Obra');
  XLSX.writeFile(wb, `diario-obra-${nomeEmpresa(state.diarioEmpresaId).replace(/\\s+/g,'-')}-${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Excel exportado.');
}
window.exportarDiarioExcel = exportarDiarioExcel;

function renderRelatorio(){
  if(DB.registros.length===0){
    return `
      <div class="topbar"><div><h2>Relatório</h2><p class="desc">Indicadores consolidados de todos os projetos, empresas e estruturas, prontos para exportar.</p></div></div>
      <div class="card"><div class="empty"><div class="big">Nenhum dado lançado ainda</div><p>Use a aba Apontar para começar.</p></div></div>`;
  }
  let regsBase = DB.registros;
  if(state.filtroProjeto!=='all') regsBase = regsBase.filter(r=>r.projetoId===state.filtroProjeto);

  const aguardando = regsBase.filter(r=>!r.inicio);
  const executando = regsBase.filter(r=>r.inicio && !r.termino);
  const concluidas = regsBase.filter(r=>r.termino);
  const concluidasExec = regsBase.filter(r=>r.inicio && r.termino);

  const regsOcio = regsBase.map(r => ({ ...r, h: idleHours(r) }));
  const totalOcioso = regsOcio.reduce((s,r)=>s+r.h, 0);
  const mediaOcioso = regsOcio.length ? totalOcioso/regsOcio.length : 0;
  const porEtapaOcio = {};
  regsOcio.forEach(r=>{ if(!porEtapaOcio[r.etapaId]) porEtapaOcio[r.etapaId]={soma:0,n:0}; porEtapaOcio[r.etapaId].soma+=r.h; porEtapaOcio[r.etapaId].n+=1; });
  const rankingOcio = Object.entries(porEtapaOcio).map(([etapaId,v])=>({ etapaId, media: v.soma/v.n, n: v.n })).sort((a,b)=>b.media-a.media);
  const maxOcio = Math.max(...rankingOcio.map(r=>r.media), 1);
  const etapaMaisOciosa = rankingOcio[0] ? nomeEtapa(rankingOcio[0].etapaId) : '—';

  const RE = montarRankingEmpresa(concluidasExec, execHours);
  const agora = new Date().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

  const estruturasComDados = DB.estruturas.filter(es => regsBase.some(r=>r.estruturaId===es.id));
  const blocosEstrutura = estruturasComDados.map(es=>{
    const regsEst = concluidasExec.filter(r=>r.estruturaId===es.id);
    const R = montarRanking(regsEst, execHours);
    return `
      <div class="card">
        <h3>${esc(es.nome)} ${es.categoria ? `<span class="estrutura-tag">${esc(es.categoria)}</span>` : ''} <span class="tag">${regsEst.length} etapa(s) concluída(s)</span></h3>
        <div class="kpi-row">
          <div class="kpi"><div class="label">Duração média</div><div class="value">${fmtHoras(R.mediaGeral)}</div></div>
          <div class="kpi"><div class="label">Metros executados</div><div class="value">${R.totalM}m</div></div>
          <div class="kpi"><div class="label">Produtividade</div><div class="value">${R.produtividadeGeral!==null?R.produtividadeGeral.toFixed(1)+' m/h':'—'}</div></div>
        </div>
        ${R.ranking.length ? `<table style="margin-top:14px"><thead><tr><th>Etapa</th><th style="text-align:right">Duração média</th><th style="text-align:right">Metros</th><th style="text-align:right">m/h</th><th style="text-align:right">Lançamentos</th></tr></thead><tbody>
          ${R.ranking.map(r=>`<tr><td>${esc(nomeEtapa(r.etapaId))}</td><td class="num">${fmtHoras(r.media)}</td><td class="num">${r.metros}m</td><td class="num">${r.mPorHora!==null?r.mPorHora.toFixed(1):'—'}</td><td class="num">${r.n}</td></tr>`).join('')}
        </tbody></table>` : `<p style="font-size:13px; color:var(--grafite-suave); margin-top:10px">Sem etapas concluídas ainda.</p>`}
      </div>`;
  }).join('');

  // progresso dos elementos (orçado x executado) por projeto
  const elementosDoProjeto = state.filtroProjeto==='all' ? DB.elementos : DB.elementos.filter(el=>el.projetoId===state.filtroProjeto);
  const blocoElementos = elementosDoProjeto.length ? `
    <div class="card">
      <h3>Progresso dos elementos <span class="tag">orçado × executado</span></h3>
      ${elementosDoProjeto.map(el=>{
        const linhas = etapasDoElemento(el.id).filter(et=>et.quantidadeOrcada!=null).map(et=>{
          const executado = DB.registros.filter(r=>r.elementoId===el.id && r.etapaId===et.id).reduce((s,r)=>s+(r.quantidadeExecutada||0),0);
          const pct = et.quantidadeOrcada>0 ? Math.min(100,(executado/et.quantidadeOrcada)*100) : 0;
          return `<div class="rank-row"><div class="label">${esc(et.name)}</div><div class="bar-track"><div class="bar-fill ${pct>=100?'verde':(pct>0?'amarelo':'vermelho')}" style="width:${Math.max(pct,2)}%"></div></div><div class="val">${executado}/${et.quantidadeOrcada} ${esc(et.unidadeOrcada)} (${pct.toFixed(0)}%)</div></div>`;
        }).join('');
        return `<p style="font-family:'Oswald',sans-serif; font-size:13px; margin:14px 0 6px 0;">${esc(el.codigo)} <span class="tag">${esc(nomeEstrutura(el.estruturaId))} · ${esc(trechoNomeCurto(el.trechoId))}</span></p>${linhas || `<p style="font-size:12px; color:var(--grafite-suave)">Sem orçamento.</p>`}`;
      }).join('')}
    </div>` : '';

  const usoRecursos = {};
  DB.registros.forEach(r=>{
    const h = execHours(r);
    if(h===null) return;
    (r.recursos||[]).forEach(a=>{
      if(!usoRecursos[a.recursoId]) usoRecursos[a.recursoId] = { horas:0, custo:0 };
      usoRecursos[a.recursoId].horas += h * a.quantidade;
      const rec = DB.recursos.find(x=>x.id===a.recursoId);
      if(rec) usoRecursos[a.recursoId].custo += h * a.quantidade * (rec.custoHora||0);
    });
  });
  const rankingRecursos = Object.entries(usoRecursos).map(([recursoId, v])=>({ recursoId, horas: v.horas, custo: v.custo })).sort((a,b)=>b.horas-a.horas);
  const acumIndiceReal = {};
  DB.registros.forEach(reg=>{
    const ir = indiceRealRegistro(reg);
    if(ir===null) return;
    (reg.recursos||[]).forEach(a=>{
      const rec = DB.recursos.find(x=>x.id===a.recursoId);
      if(!rec || rec.unidade !== reg.unidadeExecutada) return;
      if(!acumIndiceReal[rec.id]) acumIndiceReal[rec.id] = { soma:0, n:0 };
      acumIndiceReal[rec.id].soma += ir; acumIndiceReal[rec.id].n += 1;
    });
  });
  const blocoRecursos = DB.recursos.length ? `
    <div class="card">
      <h3>Recursos AHBT alocados <span class="tag">índice real medido em campo</span></h3>
      ${rankingRecursos.length ? `<table style="margin-top:6px"><thead><tr><th>Recurso</th><th>Unidade</th><th>Índice real</th><th style="text-align:right">Horas-recurso</th><th style="text-align:right">Custo AHBT</th></tr></thead><tbody>
        ${rankingRecursos.map(r=>{
          const rec = DB.recursos.find(x=>x.id===r.recursoId);
          if(!rec) return '';
          const real = acumIndiceReal[rec.id];
          const realTxt = real ? `${(real.soma/real.n).toFixed(2)} ${esc(rec.unidade)}/h (${real.n}x)` : '—';
          return `<tr><td>${esc(rec.nome)}</td><td class="mono">${esc(rec.unidade)}</td><td class="mono">${realTxt}</td><td class="num">${fmtHoras(r.horas)}</td><td class="num">${fmtMoeda(r.custo)}</td></tr>`;
        }).join('')}
      </tbody></table>` : `<p style="font-size:13px; color:var(--grafite-suave)">Nenhum recurso alocado em lançamentos ainda.</p>`}
    </div>` : '';

  const registrosAHBTcomCusto = regsBase.filter(r => custoRecursosRegistro(r) > 0);
  const custoTotalAHBT = registrosAHBTcomCusto.reduce((s,r)=>s+custoRecursosRegistro(r), 0);
  const porAtividade = {};
  registrosAHBTcomCusto.forEach(r=>{
    const chave = `${r.trechoId}|${r.estruturaId}|${r.etapaId}`;
    if(!porAtividade[chave]) porAtividade[chave] = { trechoId:r.trechoId, estruturaId:r.estruturaId, etapaId:r.etapaId, empresaId:r.empresaId, custo:0, registros:0 };
    porAtividade[chave].custo += custoRecursosRegistro(r);
    porAtividade[chave].registros += 1;
  });
  const listaAtividades = Object.values(porAtividade).sort((a,b)=>b.custo-a.custo);
  const blocoCustoAHBT = `
    <div class="card">
      <h3>Custo de recursos da AHBT <span class="tag">para acerto de contas com empreiteiras por pacote</span></h3>
      <div class="kpi-row" style="margin-bottom:14px">
        <div class="kpi"><div class="label">Custo total AHBT</div><div class="value">${fmtMoeda(custoTotalAHBT)}</div></div>
        <div class="kpi"><div class="label">Atividades com custo</div><div class="value">${listaAtividades.length}</div></div>
      </div>
      ${listaAtividades.length ? `<table><thead><tr><th>Trecho</th><th>Estrutura</th><th>Etapa</th><th>Empresa executora</th><th style="text-align:right">Lançamentos</th><th style="text-align:right">Custo AHBT</th></tr></thead><tbody>
        ${listaAtividades.map(a=>`<tr><td>${esc(trechoNomeCurto(a.trechoId))}</td><td>${esc(nomeEstrutura(a.estruturaId))}</td><td>${esc(nomeEtapa(a.etapaId))}</td><td>${esc(nomeEmpresa(a.empresaId))}</td><td class="num">${a.registros}</td><td class="num">${fmtMoeda(a.custo)}</td></tr>`).join('')}
      </tbody></table>` : `<p style="font-size:13px; color:var(--grafite-suave)">Nenhum custo de recurso da AHBT registrado ainda — só é contabilizado quando algum recurso da AHBT é alocado.</p>`}
    </div>`;

  return `
    <div class="topbar no-print"><div><h2>Relatório</h2><p class="desc">Indicadores consolidados de todos os projetos, empresas e estruturas, prontos para exportar.</p></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end">
        <div style="min-width:200px"><label>Projeto</label><select onchange="state.filtroProjeto=this.value; render();">${filtroProjetoOptionsHtml(state.filtroProjeto)}</select></div>
        <button class="btn secondary" onclick="exportarCSV()">${ICONS.download} Exportar CSV</button>
        <button class="btn" onclick="window.print()">${ICONS.print} Exportar / Imprimir PDF</button>
      </div>
    </div>

function exportarCSV(){
  const linhas = [['Projeto','Elemento','Estrutura','Empresa','Trecho','Frente (estacas)','Etapa','Liberação','Início','Término','Ociosidade (h)','Duração (h)','Metros','Produtividade (m/h)','Quantidade executada','Unidade','Índice real','Situação','Recursos AHBT alocados','Custo AHBT (R$)']];
  DB.registros.forEach(r=>{
    const hOcio = idleHours(r);
    const hExec = execHours(r);
    const m = comprimentoFrenteMetros(r.faixaInicio, r.faixaFim);
    const situacao = r.termino ? 'Concluída' : (r.pausadoDesde ? 'Pausada' : (r.inicio ? 'Em execução' : 'Aguardando efetivo'));
    const custo = custoRecursosRegistro(r);
    const ir = indiceRealRegistro(r);
    linhas.push([nomeProjeto(r.projetoId), r.elementoId ? (nomeElemento(r.elementoId)||'') : '', nomeEstrutura(r.estruturaId), nomeEmpresa(r.empresaId), trechoNomeCurto(r.trechoId), `${r.faixaInicio}-${r.faixaFim}`, nomeEtapa(r.etapaId), r.liberacao||'', r.inicio||'', r.termino||'', hOcio.toFixed(2), hExec!==null?hExec.toFixed(2):'', m, (hExec && m) ? (m/hExec).toFixed(1) : '', r.quantidadeExecutada??'', r.unidadeExecutada||'', ir!==null?ir.toFixed(2):'', situacao, recursosResumo(r), custo.toFixed(2)]);
  });
  const csv = linhas.map(linha => linha.map(campo => {
    const s = String(campo??'');
    return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `frente-livre-indicadores-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV exportado.');
}
window.exportarCSV = exportarCSV;

function exportarBackupJSON(){
  const backup = {
    versao: 2, exportadoEm: new Date().toISOString(),
    projetos: DB.projetos, estacas: DB.estacas, estruturas: DB.estruturas, etapas: DB.etapas,
    empresas: DB.empresas, recursos: DB.recursos, elementos: DB.elementos, registros: DB.registros,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `frente-livre-backup-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup completo exportado.');
}

function acionarImportarBackup(){ document.getElementById('input-importar-backup').click(); }
window.acionarImportarBackup = acionarImportarBackup;
function importarBackupJSON(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const leitor = new FileReader();
  leitor.onload = async (e) => {
    try{
      const backup = JSON.parse(e.target.result);
      if(!backup || !Array.isArray(backup.registros)){ showToast('Arquivo inválido.'); return; }
      const resumo = `Projetos: ${(backup.projetos||[]).length} · Trechos: ${(backup.estacas||[]).length} · Estruturas: ${(backup.estruturas||[]).length} · Etapas: ${(backup.etapas||[]).length} · Empresas: ${(backup.empresas||[]).length} · Recursos: ${(backup.recursos||[]).length} · Elementos: ${(backup.elementos||[]).length} · Lançamentos: ${(backup.registros||[]).length}`;
      if(!confirm(`Isso vai SUBSTITUIR todos os dados atuais pelos do backup (exportado em ${backup.exportadoEm ? fmtDataHora(backup.exportadoEm) : 'data desconhecida'}).\n\n${resumo}\n\nContinuar?`)) return;
      DB.projetos = backup.projetos || [{ id: uid(), nome: 'Projeto Padrão' }];
      DB.estacas = backup.estacas || [];
      DB.estruturas = (backup.estruturas || []).map(e => ({ usaElementos:false, categoria:null, projetoId: DB.projetos[0].id, ...e }));
      DB.etapas = backup.etapas || [];
      DB.empresas = (backup.empresas || []).map(e => ({ profissionais:[], ...e }));
      DB.recursos = (backup.recursos || []).map(r => ({ custoHora:0, ...r }));
      DB.elementos = (backup.elementos || []).map(el => ({ orcamento:[], projetoId: DB.projetos[0].id, ...el }));
      DB.registros = (backup.registros || []).map(r => ({ recursos:[], quantidadeExecutada:null, unidadeExecutada:null, elementoId:null, pausas:[], pausadoDesde:null, efetivoDiario:[], projetoId: DB.projetos[0].id, ...r }));
      await Promise.all([persist.projetos(), persist.estacas(), persist.estruturas(), persist.etapas(), persist.empresas(), persist.recursos(), persist.elementos(), persist.registros()]);
      showToast('Backup restaurado com sucesso.');
      inputEl.value = '';
      render();
    } catch(err){ showToast('Não foi possível ler o arquivo de backup.'); }
  };
  leitor.readAsText(file);
}
window.importarBackupJSON = importarBackupJSON;

function moveTrecho(id, dir){
  const lista = DB.estacas.filter(e=>e.projetoId===state.frentesProjetoId).sort((a,b)=>(a.order??0)-(b.order??0));
  const idx = lista.findIndex(e=>e.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=lista.length) return;
  const tmp = lista[idx].order; lista[idx].order = lista[swapIdx].order; lista[swapIdx].order = tmp;
  persist.estacas(); render();
}
window.moveTrecho = moveTrecho;
function updateTrecho(id, campo, valor){
  const e = DB.estacas.find(x=>x.id===id);
  const v = valor.trim();
  if((campo==='estacaInicio' || campo==='estacaTermino') && !v) return;
  e[campo] = v;
  persist.estacas();
  showToast('Trecho atualizado.');
  render();
}

  const maxOrder = DB.estacas.filter(e=>e.projetoId===state.frentesProjetoId).reduce((m,e)=>Math.max(m,e.order??0), -1);
  DB.estacas.push({ id: uid(), projetoId: state.frentesProjetoId, estacaInicio, estacaTermino, trecho: f.trecho.value.trim(), order: maxOrder+1 });
  persist.estacas();
  showToast('Trecho cadastrado.');
  f.reset(); render();
  return false;
}

  if(!state.estruturasProjetoId || !DB.projetos.find(p=>p.id===state.estruturasProjetoId)) state.estruturasProjetoId = DB.projetos[0].id;

    const n = DB.etapas.filter(e=>e.estruturaId===es.id).length;

        </div>
        <button class="btn" type="submit">${ICONS.plus} Adicionar</button>
      </form>
    </div>

    </div>`;
}
function updateNomeEstrutura(id, valor){
  const es = DB.estruturas.find(e=>e.id===id);
  const nome = valor.trim();
  if(!nome) return;
  es.nome = nome;
  persist.estruturas();
  showToast('Nome atualizado.');
  render();
}
window.updateNomeEstrutura = updateNomeEstrutura;
function updateCategoriaEstrutura(id, valor){
  const es = DB.estruturas.find(e=>e.id===id);
  es.categoria = valor || null;
  persist.estruturas();
  render();
}
window.updateCategoriaEstrutura = updateCategoriaEstrutura;
function toggleUsaElementos(id, checked){
  const es = DB.estruturas.find(e=>e.id===id);
  es.usaElementos = checked;
  persist.estruturas();
  showToast(checked ? `"${es.nome}" agora usa elementos.` : `"${es.nome}" não usa mais elementos.`);
  render();
}
window.toggleUsaElementos = toggleUsaElementos;
function submitEstrutura(ev){
  ev.preventDefault();
  const f = ev.target;
  const nome = f.nome.value.trim();
  if(!nome) return false;
  const usaElementos = f.usaElementos.value === 'sim';
  const novaEstrutura = { id: uid(), projetoId: state.estruturasProjetoId, nome, categoria: f.categoria.value || null, usaElementos };
  DB.estruturas.push(novaEstrutura);
  persist.estruturas();
  f.reset();
  if(usaElementos){
    showToast(`Estrutura "${nome}" cadastrada. Agora cadastre os elementos dela.`);
    state.tab = 'elementos';
    state.elementosProjetoId = novaEstrutura.projetoId;
    state.elementosEstruturaId = novaEstrutura.id;
    resetElForm();
  } else {
    showToast('Estrutura cadastrada.');
  }
  render();
  return false;
}
window.submitEstrutura = submitEstrutura;
function deleteEstrutura(id){
  const temEtapas = DB.etapas.some(e=>e.estruturaId===id);
  const temRegistros = DB.registros.some(r=>r.estruturaId===id);
  if((temEtapas || temRegistros) && !confirm('Essa estrutura já tem etapas e/ou lançamentos vinculados. Excluir não apaga o histórico, mas as etapas ficarão órfãs. Continuar?')) return;
  DB.estruturas = DB.estruturas.filter(e=>e.id!==id);
  persist.estruturas(); render();
}
window.deleteEstrutura = deleteEstrutura;

function submitElemento(ev){
  ev.preventDefault();
  const f = ev.target;
  const codigo = f.codigo.value.trim();
  if(!codigo){ showToast('Informe o código/nome da peça.'); return false; }
  if(!state.elForm.eixoId){ showToast('Escolha o eixo.'); return false; }
  const estruturaId = state.elementosEstruturaId;
  const projetoId = state.elementosProjetoId;
  const eixoId = state.elForm.eixoId;
  const novoElemento = { id: uid(), projetoId, estruturaId, codigo, eixoId, trechoId: null, faixaInicio: null, faixaFim: null, orcamento: [] };
  DB.elementos.push(novoElemento);
  persist.elementos();
  showToast('Elemento cadastrado. Agora cadastre as etapas dessa peça.');
  resetElForm();
  state.elementoEtapasAbertoId = novoElemento.id;
  render();
  return false;
}
window.submitElemento = submitElemento;
function updateCodigoElemento(id, valor){
  const el = DB.elementos.find(x=>x.id===id);
  const codigo = valor.trim();
  if(!codigo) return;
  el.codigo = codigo;
  persist.elementos();
  showToast('Código atualizado.');
  render();
}
window.updateCodigoElemento = updateCodigoElemento;
function submitEtapaElemento(ev, elementoId){
  ev.preventDefault();
  const f = ev.target;
  const name = f.name.value.trim();
  if(!name){ showToast('Informe o nome da etapa.'); return false; }
  const quantidade = f.quantidade.value ? parseFloat(f.quantidade.value) : null;
  const unidade = f.unidade.value;
  const el = DB.elementos.find(x=>x.id===elementoId);
  const maxOrder = etapasDoElemento(elementoId).reduce((m,e)=>Math.max(m,e.order), -1);
  DB.etapas.push({ id: uid(), estruturaId: el.estruturaId, elementoId, name, desc: null, order: maxOrder+1, empresaPadraoId: null, quantidadeOrcada: quantidade, unidadeOrcada: quantidade!=null ? unidade : null });
  persist.etapas();
  showToast('Etapa adicionada.');
  render();
  return false;
}
window.submitEtapaElemento = submitEtapaElemento;
function updateNomeEtapaElemento(etapaId, valor){
  const e = DB.etapas.find(x=>x.id===etapaId);
  const nome = valor.trim();
  if(!nome) return;
  e.name = nome;
  persist.etapas();
  render();
}
window.updateNomeEtapaElemento = updateNomeEtapaElemento;
function updateQuantidadeEtapaElemento(etapaId, campo, valor){
  const e = DB.etapas.find(x=>x.id===etapaId);
  if(campo==='quantidadeOrcada'){
    e.quantidadeOrcada = valor==='' ? null : Math.max(0, parseFloat(valor)||0);
  } else {
    e.unidadeOrcada = valor;
  }
  persist.etapas();
  render();
}
window.updateQuantidadeEtapaElemento = updateQuantidadeEtapaElemento;
function deleteEtapaElemento(elementoId, etapaId){
  const emUso = DB.registros.some(r=>r.etapaId===etapaId);
  if(emUso && !confirm('Esta etapa já possui registros lançados. Excluir o cadastro não apaga os registros existentes. Continuar?')) return;
  DB.etapas = DB.etapas.filter(e=>e.id!==etapaId);
  persist.etapas(); render();
}
window.deleteEtapaElemento = deleteEtapaElemento;
function deleteElemento(id){
  const emUso = DB.registros.some(r=>r.elementoId===id);
  if(emUso && !confirm('Este elemento já tem lançamentos vinculados. Excluir não apaga o histórico, mas o vínculo ficará órfão. Continuar?')) return;
  DB.elementos = DB.elementos.filter(e=>e.id!==id);
  DB.etapas = DB.etapas.filter(e=>e.elementoId!==id);
  persist.elementos(); persist.etapas(); render();
}
window.deleteElemento = deleteElemento;

function submitEtapa(ev){
  ev.preventDefault();
  const f = ev.target;
  const name = f.name.value.trim();
  if(!name) return false;
  const maxOrder = etapasDaEstrutura(state.etapasEstruturaId).reduce((m,e)=>Math.max(m,e.order), -1);
  DB.etapas.push({ id: uid(), estruturaId: state.etapasEstruturaId, elementoId: null, name, desc: null, order: maxOrder+1, empresaPadraoId: null, quantidadeOrcada: null, unidadeOrcada: null });
  persist.etapas();
  showToast('Etapa adicionada.');
  f.reset(); render();
  return false;
}
window.submitEtapa = submitEtapa;
function updateNomeEtapa(id, valor){
  const e = DB.etapas.find(x=>x.id===id);
  const nome = valor.trim();
  if(!nome) return;
  e.name = nome;
  persist.etapas();
  showToast('Nome atualizado.');
  render();
}
window.updateNomeEtapa = updateNomeEtapa;
function updateEmpresaPadrao(etapaId, empresaId){
  const e = DB.etapas.find(x=>x.id===etapaId);
  e.empresaPadraoId = empresaId || null;
  persist.etapas();
  showToast('Empresa padrão atualizada.');
  render();
}
window.updateEmpresaPadrao = updateEmpresaPadrao;
function moveEtapa(id, dir){
  const list = etapasDaEstrutura(state.etapasEstruturaId);
  const idx = list.findIndex(e=>e.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=list.length) return;
  const tmp = list[idx].order; list[idx].order = list[swapIdx].order; list[swapIdx].order = tmp;
  persist.etapas(); render();
}
window.moveEtapa = moveEtapa;
function deleteEtapa(id){
  const emUso = DB.registros.some(r=>r.etapaId===id);
  if(emUso && !confirm('Esta etapa já possui registros lançados. Excluir o cadastro não apaga os registros existentes. Continuar?')) return;
  DB.etapas = DB.etapas.filter(e=>e.id!==id);
  persist.etapas(); render();
}
window.deleteEtapa = deleteEtapa;

function deleteEmpresa(id){

        <td style="text-align:right; white-space:nowrap">
          <button class="icon-btn edit" onclick="state.editRegId='${r.id}'; render();">${ICONS.edit}</button>
          <button class="icon-btn" onclick="deleteRegistro('${r.id}')">${ICONS.trash}</button>
        </td>
      </tr>`;
  }).join('');

  return `
    <div class="topbar"><div><h2>Histórico</h2><p class="desc">Lance manualmente ou corrija qualquer lançamento. No dia a dia, use a aba Apontar.</p></div></div>
    <div class="card"><h3>Novo lançamento manual</h3>
      <form onsubmit="return submitRegistro(event)">
        <div class="grid4">
          <div class="field"><label>Projeto *</label><select name="projetoId" required>${projetoOptionsSel(null)}</select></div>
          <div class="field"><label>Trecho *</label><select name="trechoId" required>${trechoOptionsSel(null, null)}</select></div>
          <div class="field"><label>Estaca início *</label><input type="text" name="faixaInicio" required placeholder="Ex.: 4038"></div>
          <div class="field"><label>Estaca término *</label><input type="text" name="faixaFim" required placeholder="Ex.: 4039"></div>
        </div>
        <div class="grid3">
          <div class="field"><label>Estrutura *</label><select name="estruturaId" required>${estruturaOptionsSel(null)}</select></div>
          <div class="field"><label>Etapa *</label><select name="etapaId" required>${etapaOptionsSel(null, null)}</select></div>
          <div class="field"><label>Empresa *</label><select name="empresaId" required>${empresaOptionsSel(null)}</select></div>
        </div>
        <div class="grid3">
          <div class="field"><label>Liberada em *</label><input type="datetime-local" name="liberacao" required></div>
          <div class="field"><label>Início efetivo (se já souber)</label><input type="datetime-local" name="inicio"></div>
          <div class="field"><label>Término (se já souber)</label><input type="datetime-local" name="termino"></div>
        </div>
        <div class="field"><label>Observação</label><input type="text" name="obs" placeholder="Opcional"></div>
        <button class="btn" type="submit">${ICONS.plus} Lançar</button>
      </form>
    </div>
    <div class="card">
      <h3>Lançamentos <span class="tag">${list.length} registro(s)</span></h3>
      <div class="grid4" style="margin-bottom:14px">
        <div class="field"><label>Filtrar por projeto</label><select onchange="state.filtroProjeto=this.value; render();">${filtroProjetoOptionsHtml(state.filtroProjeto)}</select></div>
        <div class="field"><label>Filtrar por etapa</label><select onchange="state.filtroEtapa=this.value; render();">${filtroEtapaOptions}</select></div>
        <div class="field"><label>Filtrar por trecho</label><select onchange="state.filtroEstaca=this.value; render();">${filtroTrechoOptions}</select></div>
        <div class="field"><label>Filtrar por estrutura</label><select onchange="state.filtroEstrutura=this.value; render();">${filtroEstruturaOptions}</select></div>
      </div>
      <div class="grid4" style="margin-bottom:14px">
        <div class="field"><label>Filtrar por empresa</label><select onchange="state.filtroEmpresa=this.value; render();">${filtroEmpresaOptions}</select></div>
      </div>
      ${list.length ? `<table><thead><tr><th>Projeto</th><th>Frente</th><th>Estrutura</th><th>Etapa</th><th>Empresa</th><th>Liberada em</th><th>Início</th><th>Término</th><th>Ociosidade</th><th>Duração</th><th>Qtd. exec.</th><th>Recursos</th><th>Custo AHBT</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
        : `<div class="empty"><div class="big">Nenhum registro com esse filtro</div></div>`}
    </div>`;
}
function trechoOptionsGlobal(projetoId, selId){
  return DB.estacas.filter(e=>e.projetoId===projetoId).sort((a,b)=>(a.trecho||'').localeCompare(b.trecho||'', undefined, {numeric:true})).map(e=>`<option value="${e.id}" ${e.id===selId?'selected':''}>${esc(e.trecho||nomeTrecho(e.id))} (${esc(e.estacaInicio)}–${esc(e.estacaTermino)})</option>`).join('');
}
window.trechoOptionsGlobal = trechoOptionsGlobal;
function submitRegistro(ev){
  ev.preventDefault();
  const f = ev.target;
  const projetoId = f.projetoId.value;
  const trechoId = f.trechoId.value;
  const faixaInicio = f.faixaInicio.value.trim();
  const faixaFim = f.faixaFim.value.trim();
  const estruturaId = f.estruturaId.value;
  const etapaId = f.etapaId.value;
  const empresaId = f.empresaId.value;
  const liberacao = f.liberacao.value;
  const inicio = f.inicio.value;
  const termino = f.termino.value;
  if(!projetoId || !trechoId || !faixaInicio || !faixaFim || !estruturaId || !etapaId || !empresaId || !liberacao){
    showToast('Preencha todos os campos obrigatórios.');
    return false;
  }
  if(inicio && new Date(inicio) < new Date(liberacao)){ showToast('O início não pode ser antes da liberação.'); return false; }
  if(termino && !inicio){ showToast('Preencha o início antes do término.'); return false; }
  if(termino && new Date(termino) < new Date(inicio)){ showToast('O término não pode ser antes do início.'); return false; }
  DB.registros.push({ id: uid(), projetoId, trechoId, faixaInicio, faixaFim, estruturaId, etapaId, empresaId, liberacao, inicio: inicio||null, termino: termino||null, pausas:[], pausadoDesde:null, recursos:[], efetivoDiario:[], quantidadeExecutada:null, unidadeExecutada:null, elementoId:null, obs: f.obs.value.trim(), createdAt: Date.now() });
  persist.registros();
  showToast('Lançamento registrado.');
  f.reset(); render();
  return false;
}
window.submitRegistro = submitRegistro;
function updateInicio(id, value){
  const reg = DB.registros.find(r=>r.id===id);
  if(value && new Date(value) < new Date(reg.liberacao)){ showToast('O início não pode ser antes da liberação.'); render(); return; }
  reg.inicio = value || null;
  if(!reg.inicio) reg.termino = null;
  persist.registros();
  render();
}
window.updateInicio = updateInicio;
function updateTermino(id, value){
  const reg = DB.registros.find(r=>r.id===id);
  if(value && reg.inicio && new Date(value) < new Date(reg.inicio)){ showToast('O término não pode ser antes do início.'); render(); return; }
  reg.termino = value || null;
  persist.registros();
  render();
}
window.updateTermino = updateTermino;
function salvarEdicaoRegistro(id){
  const r = DB.registros.find(x=>x.id===id);
  const projetoId = document.getElementById(`edit-reg-projeto-${id}`).value;
  const trechoId = document.getElementById(`edit-reg-trecho-${id}`).value;
  const faixaInicio = document.getElementById(`edit-reg-faixaIni-${id}`).value.trim();
  const faixaFim = document.getElementById(`edit-reg-faixaFim-${id}`).value.trim();
  const estruturaId = document.getElementById(`edit-reg-estrutura-${id}`).value;
  const etapaId = document.getElementById(`edit-reg-etapa-${id}`).value;
  const empresaId = document.getElementById(`edit-reg-empresa-${id}`).value;
  if(!projetoId || !trechoId || !faixaInicio || !faixaFim || !estruturaId || !etapaId || !empresaId){
    showToast('Preencha todos os campos.');
    return;
  }
  r.projetoId=projetoId; r.trechoId=trechoId; r.faixaInicio=faixaInicio; r.faixaFim=faixaFim; r.estruturaId=estruturaId; r.etapaId=etapaId; r.empresaId=empresaId;
  persist.registros();
  state.editRegId = null;
  showToast('Registro atualizado.');
  render();
}
window.salvarEdicaoRegistro = salvarEdicaoRegistro;
function deleteRegistro(id){
  DB.registros = DB.registros.filter(r=>r.id!==id);
  persist.registros(); render();
}
window.deleteRegistro = deleteRegistro;

/* ---------------------------------------------------------
   BOOT
--------------------------------------------------------- */
(async function boot(){
  if(!FIREBASE_CONFIGURADO){
    document.getElementById('main').innerHTML = `
      <div class="card" style="max-width:640px; margin:60px auto;">
        <h3>⚠️ Firebase ainda não configurado</h3>
        <p style="font-size:14px; line-height:1.6;">Este arquivo está pronto pra funcionar como site, mas falta colar as credenciais do seu projeto Firebase.</p>
      </div>`;
    return;
  }
  await loadAll();
  render();
})();
</script>
</body>
